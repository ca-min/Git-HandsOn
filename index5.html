<!DOCTYPE html>
<html>
    <form action="/submit" method="POST">
        <div>
            ユーザー名: 
            <input type="text" name="user_name" placeholder="ユーザー名を入力" required>
        </div>
        <div>
            パスワード: 
            <input type="password" name="password" placeholder="パスワードを入力" required>
        </div>
        <div>
            性別:
            <label><input type="radio" name="gender" value="男" required> 男性</label>
            <label><input type="radio" name="gender" value="女" required> 女性</label>
        </div>
        <div>
            <label><input type="checkbox" name="subscribe" value="yes"> ニュースレターを購読する</label>
        </div>
        <br>
        <div>
            <label for="animals">好きな動物を選択</label>
            <select id="animals" name="animals">
                <option value="dog">犬</option>
                <option value="cat">猫</option>
                <option value="buta">豚</option>
                <option value="uma">馬</option>
            </select>    
        </div>
        <br>
        <div>
            <label for="contact">質問や不明点</label>
        </div>
            <textarea id="contact" name="contact" rows="10" cols="50" placeholder="入力"></textarea>
        </div>
        <div>
            <input type="submit" value="送信">
        </div>
</html>
